<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Series — Maru Manhwa</title><link rel="stylesheet" href="css/style.css"></head><body><div id="nav"></div><main class="page"><div class="container" id="app"></div></main><div id="footer"></div><script type="module">import {footer,nav,getSeries,saveHistory,toggleBookmark,esc} from './js/app.js';import {db,FB,auth,firebaseReady} from './js/firebase.js';nav();let id=new URLSearchParams(location.search).get('id')||'solo-leveling';let s=await getSeries(id);let chapters=[];if(firebaseReady){let r=await FB.getDocs(FB.query(FB.collection(db,'series',id,'chapters'),FB.orderBy('number','desc')));chapters=r.docs.map(d=>({id:d.id,...d.data()}))}if(!chapters.length)chapters=Array.from({length:Math.min(s.chapters||12,30)},(_,i)=>({id:String(i+1),number:(s.chapters||30)-i,title:''}));app.innerHTML=`<div class="series"><div><div class="cover"><img src="${esc(s.cover)}"></div></div><div><div class="badge">${esc(s.status||'Ongoing')}</div><h1>${esc(s.title)}</h1><div class="muted">★ ${s.rating||'—'} · ${esc(s.author||'Unknown')} · ${esc(s.artist||'Unknown')}</div><p class="muted" style="line-height:1.7">${esc(s.description||'No description yet.')}</p><div class="tags">${(s.genres||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div><button id="bm" class="btn">♡ Bookmark</button></div></div><div class="chapterlist">${chapters.map(c=>`<a class="chapter" href="reader.html?series=${encodeURIComponent(id)}&chapter=${encodeURIComponent(c.id)}"><span>Chapter ${c.number}${c.title?' — '+esc(c.title):''}</span><span class="muted">Read →</span></a>`).join('')}</div></div>`;bm.onclick=async()=>{if(!auth){alert('Please log in first.');return}let x=await toggleBookmark(s);bm.textContent=x?'♥ Bookmarked':'♡ Bookmark'};footerEl.innerHTML=footer();</script></body></html>
