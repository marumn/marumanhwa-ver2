<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reader — Maru Manhwa</title><link rel="stylesheet" href="css/style.css"></head><body class="reader"><div class="readerbar"><div class="readerin"><a class="btn secondary" id="back">←</a><div class="grow" id="name">Reader</div><select id="chapters" class="field" style="width:auto;margin:0"></select><button class="btn secondary" id="top">↑</button></div></div><main class="pages" id="pages"></main><section class="reader-social container"><div class="reactionbox"><h2>React to this chapter</h2><div id="reactions" class="reactions"></div></div><div class="comments"><div class="sectionhead"><h2>Comments</h2><span id="commentHint" class="muted"></span></div><div id="commentForm"></div><div id="commentList" class="commentlist"></div></div></section><div id="footer"></div><script type="module">
import {getSeries,saveHistory,esc,footer} from './js/app.js';import {db,FB,auth,firebaseReady} from './js/firebase.js';import {demoPages} from './js/data.js';
const sp=new URLSearchParams(location.search),sid=sp.get('series')||'solo-leveling',cid=sp.get('chapter')||'1';const s=await getSeries(sid);let chapters=[];
if(firebaseReady){const r=await FB.getDocs(FB.query(FB.collection(db,'series',sid,'chapters'),FB.orderBy('number','asc')));chapters=r.docs.map(d=>({id:d.id,...d.data()}))}
if(!chapters.length)chapters=Array.from({length:Math.min(s?.chapters||12,30)},(_,i)=>({id:String(i+1),number:i+1,pages:demoPages}));
const c=chapters.find(x=>String(x.id)===String(cid))||chapters[0];name.textContent=`${s.title} — Chapter ${c.number}`;back.onclick=()=>location.href=`series.html?id=${encodeURIComponent(sid)}`;chaptersEl();top.onclick=()=>scrollTo({top:0,behavior:'smooth'});pages.innerHTML=(c.pages||demoPages).map((p,i)=>`<img src="${esc(p)}" loading="${i<2?'eager':'lazy'}" alt="Page ${i+1}">`).join('');await saveHistory(s,c.number);footerEl();renderSocial();
function chaptersEl(){document.querySelector('#chapters').innerHTML=chapters.map(x=>`<option value="${esc(x.id)}" ${String(x.id)===String(c.id)?'selected':''}>Chapter ${x.number}</option>`).join('');document.querySelector('#chapters').onchange=e=>location.href=`reader.html?series=${encodeURIComponent(sid)}&chapter=${encodeURIComponent(e.target.value)}`}
function footerEl(){document.querySelector('#footer').innerHTML=footer()}
async function renderSocial(){if(!firebaseReady){commentHint.textContent='Connect Firebase to enable reactions and comments.';return}const types=[['like','👍'],['love','❤️'],['fire','🔥'],['funny','😂']];const rr=await FB.getDocs(FB.collection(db,'series',sid,'chapters',String(c.id),'reactions'));const counts=Object.fromEntries(types.map(x=>[x[0],0]));let mine=null;rr.forEach(d=>{const x=d.data();if(counts[x.type]!=null)counts[x.type]++;if(auth?.currentUser?.uid===d.id)mine=x.type});reactions.innerHTML=types.map(([type,emoji])=>`<button class="reaction ${mine===type?'active':''}" data-type="${type}">${emoji} <span>${counts[type]}</span></button>`).join('');document.querySelectorAll('.reaction').forEach(b=>b.onclick=async()=>{if(!auth?.currentUser)return location.href='auth/login.html';const ref=FB.doc(db,'series',sid,'chapters',String(c.id),'reactions',auth.currentUser.uid);const snap=await FB.getDoc(ref);if(snap.exists()&&snap.data().type===b.dataset.type)await FB.deleteDoc(ref);else await FB.setDoc(ref,{type:b.dataset.type,uid:auth.currentUser.uid,updatedAt:FB.serverTimestamp()});renderSocial()});commentForm.innerHTML=auth?.currentUser?`<div class="commentcomposer"><textarea id="commentText" class="field" maxlength="2000" rows="3" placeholder="Write a comment..."></textarea><button id="postComment" class="btn">Post comment</button></div>`:`<div class="notice">Please <a href="auth/login.html"><u>log in</u></a> to comment.</div>`;if(auth?.currentUser)postComment.onclick=async()=>{const text=commentText.value.trim();if(!text)return;await FB.addDoc(FB.collection(db,'series',sid,'chapters',String(c.id),'comments'),{uid:auth.currentUser.uid,username:auth.currentUser.displayName||'Reader',text,createdAt:FB.serverTimestamp()});commentText.value='';renderSocial()};const cr=await FB.getDocs(FB.query(FB.collection(db,'series',sid,'chapters',String(c.id),'comments'),FB.orderBy('createdAt','desc'),FB.limit(100)));commentList.innerHTML=cr.empty?'<div class="empty">No comments yet. Be the first.</div>':cr.docs.map(d=>{const x=d.data();return `<article class="comment"><div class="commenthead"><strong>${esc(x.username||'Reader')}</strong><span class="muted">${x.createdAt?.toDate?x.createdAt.toDate().toLocaleString():''}</span></div><div>${esc(x.text)}</div>${auth?.currentUser?.uid===x.uid?`<button class="linkbtn" data-delete="${d.id}">Delete</button>`:''}</article>`}).join('');document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{await FB.deleteDoc(FB.doc(db,'series',sid,'chapters',String(c.id),'comments',b.dataset.delete));renderSocial()})}
</script></body></html>
