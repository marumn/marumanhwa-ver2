<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reader — Maru Manhwa</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="reader">

    <div class="readerbar">
        <div class="readerin">

            <a class="btn secondary" id="back">←</a>

            <div class="grow" id="name">
                Reader
            </div>

            <select id="chapters" class="field" style="width:auto;margin:0"></select>

            <button class="btn secondary" id="top">
                ↑
            </button>

        </div>
    </div>


    <!-- CHAPTER PAGES -->
    <main class="pages" id="pages"></main>


    <!-- REACTIONS + COMMENTS -->
    <section class="reader-social container">

        <div class="reactionbox">
            <h2>React to this chapter</h2>
            <div id="reactions" class="reactions"></div>
        </div>

        <div class="comments">

            <div class="sectionhead">
                <h2>Comments</h2>
                <span id="commentHint" class="muted"></span>
            </div>

            <div id="commentForm"></div>

            <div id="commentList" class="commentlist"></div>

        </div>

    </section>


    <div id="footer"></div>


    <script type="module">

        import {
            getSeries,
            saveHistory,
            esc,
            footer
        } from '/js/app.js';

        import {
            db,
            FB,
            auth,
            firebaseReady
        } from '/js/firebase.js';


        /* --------------------------------
           ELEMENTS
        -------------------------------- */

        const pagesEl = document.getElementById('pages');
        const nameEl = document.getElementById('name');
        const chaptersEl = document.getElementById('chapters');
        const backEl = document.getElementById('back');
        const topEl = document.getElementById('top');

        const reactionsEl = document.getElementById('reactions');
        const commentHintEl = document.getElementById('commentHint');
        const commentFormEl = document.getElementById('commentForm');
        const commentListEl = document.getElementById('commentList');

        const footerEl = document.getElementById('footer');


        /* --------------------------------
           URL
        -------------------------------- */

        const params = new URLSearchParams(location.search);

        const sid = params.get('series') || 'solo-leveling';

        const chapterId =
            params.get('chapter') || '1';


        /* --------------------------------
           GET SERIES
        -------------------------------- */

        const series = await getSeries(sid);

        if (!series) {

            pagesEl.innerHTML = `
                <div class="empty">
                    Manhwa not found.
                </div>
            `;

            throw new Error('Series not found');

        }


        /* --------------------------------
           GET CHAPTERS
        -------------------------------- */

        let chapters = [];


        if (firebaseReady) {

            try {

                const snapshot = await FB.getDocs(
                    FB.query(
                        FB.collection(
                            db,
                            'series',
                            sid,
                            'chapters'
                        ),
                        FB.orderBy('number', 'asc')
                    )
                );


                chapters = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));


            } catch (error) {

                console.error(
                    'Could not load chapters:',
                    error
                );

            }

        }


        /* --------------------------------
           DEMO FALLBACK
        -------------------------------- */

        if (!chapters.length) {

            chapters = Array.from(
                {
                    length: Math.min(
                        Number(series.chapters) || 1,
                        30
                    )
                },
                (_, index) => ({

                    id: String(index + 1),

                    number: index + 1,

                    title: `Chapter ${index + 1}`,

                    pages: []

                })
            );

        }


        /* --------------------------------
           CURRENT CHAPTER
        -------------------------------- */

        let currentChapter =
            chapters.find(
                chapter =>
                    String(chapter.id) ===
                    String(chapterId)
            );


        if (!currentChapter) {

            currentChapter = chapters[0];

        }


        /* --------------------------------
           HEADER
        -------------------------------- */

        nameEl.textContent =
            `${series.title} — Chapter ${currentChapter.number}`;


        backEl.href =
            `series?id=${encodeURIComponent(sid)}`;


        topEl.onclick = () => {

            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });

        };


        /* --------------------------------
           CHAPTER SELECTOR
        -------------------------------- */

        chaptersEl.innerHTML =
            chapters
                .map(chapter => {

                    const selected =
                        String(chapter.id) ===
                        String(currentChapter.id)
                            ? 'selected'
                            : '';

                    return `
                        <option
                            value="${esc(chapter.id)}"
                            ${selected}
                        >
                            Chapter ${esc(chapter.number)}
                        </option>
                    `;

                })
                .join('');


        chaptersEl.onchange = event => {

            const newChapter =
                event.target.value;

            window.location.href =
                `reader?series=${encodeURIComponent(sid)}&chapter=${encodeURIComponent(newChapter)}`;

        };


        /* --------------------------------
           GET PAGE URLS
        -------------------------------- */

        let pageUrls = [];


        if (Array.isArray(currentChapter.pages)) {

            pageUrls = currentChapter.pages;

        }


        /*
           Also support alternative field names
           in case an older chapter was saved
           using one of these.
        */

        if (!pageUrls.length && Array.isArray(currentChapter.pageUrls)) {

            pageUrls = currentChapter.pageUrls;

        }


        if (!pageUrls.length && Array.isArray(currentChapter.images)) {

            pageUrls = currentChapter.images;

        }


        /* --------------------------------
           CLEAN PAGE URLS
        -------------------------------- */

        pageUrls = pageUrls
            .map(page => {

                if (typeof page === 'string') {

                    return page.trim();

                }

                if (page && typeof page.url === 'string') {

                    return page.url.trim();

                }

                return '';

            })
            .filter(Boolean);


        console.log(
            'Current chapter:',
            currentChapter
        );

        console.log(
            'Page URLs:',
            pageUrls
        );


        /* --------------------------------
           DISPLAY PAGES
        -------------------------------- */

        if (!pageUrls.length) {

            pagesEl.innerHTML = `
                <div class="empty reader-empty">

                    <h2>No chapter pages found</h2>

                    <p class="muted">
                        This chapter does not have any
                        image URLs saved in Firestore.
                    </p>

                    <p class="muted">
                        Add the GitHub image URLs to this chapter
                        from the Admin page.
                    </p>

                </div>
            `;

        } else {

            pagesEl.innerHTML =
                pageUrls
                    .map((url, index) => {

                        return `
                            <img
                                src="${esc(url)}"
                                loading="${index < 2 ? 'eager' : 'lazy'}"
                                alt="Chapter ${esc(currentChapter.number)} — Page ${index + 1}"
                                class="reader-page"
                                onerror="this.classList.add('image-error');"
                            >
                        `;

                    })
                    .join('');

        }


        /* --------------------------------
           SAVE READING HISTORY
        -------------------------------- */

        await saveHistory(
            series,
            currentChapter.number
        );


        /* --------------------------------
           FOOTER
        -------------------------------- */

        footerEl.innerHTML = footer();


        /* --------------------------------
           REACTIONS + COMMENTS
        -------------------------------- */

       

await renderSocial();

async function renderSocial() {
    if (!firebaseReady || !db) {
        commentHintEl.textContent =
            'Comments are currently unavailable.';
        return;
    }

    const user = auth?.currentUser;
    const loggedIn = !!user;
    const chapterPath = [
        'series', sid,
        'chapters', String(currentChapter.id)
    ];

    const commentsRef = FB.collection(
        db, ...chapterPath, 'comments'
    );

    const reactionsRef = FB.collection(
        db, ...chapterPath, 'reactions'
    );

    const [reactionSnapshot, commentsSnapshot] =
        await Promise.all([
            FB.getDocs(reactionsRef),
            FB.getDocs(commentsRef)
        ]);

    // CHAPTER REACTIONS
    const types = [
        ['like', '👍'],
        ['love', '❤️'],
        ['fire', '🔥'],
        ['funny', '😂']
    ];

    const reactionCounts = Object.fromEntries(
        types.map(([type]) => [type, 0])
    );

    let myReaction = null;

    reactionSnapshot.forEach(item => {
        const data = item.data();

        if (reactionCounts[data.type] !== undefined) {
            reactionCounts[data.type]++;
        }

        if (loggedIn && item.id === user.uid) {
            myReaction = data.type;
        }
    });

    reactionsEl.innerHTML = types.map(([type, emoji]) => `
        <button
            class="reaction ${myReaction === type ? 'active' : ''}"
            data-chapter-reaction="${type}"
            type="button"
        >
            ${emoji} <span>${reactionCounts[type]}</span>
        </button>
    `).join('');

    reactionsEl.querySelectorAll('[data-chapter-reaction]')
        .forEach(button => {
            button.onclick = async () => {
                if (!auth?.currentUser) {
                    location.href = '/auth/login';
                    return;
                }

                try {
                    const reactionRef = FB.doc(
                        db, ...chapterPath,
                        'reactions', auth.currentUser.uid
                    );

                    const existing = await FB.getDoc(reactionRef);
                    const type = button.dataset.chapterReaction;

                    if (existing.exists() &&
                        existing.data().type === type) {
                        await FB.deleteDoc(reactionRef);
                    } else {
                        await FB.setDoc(reactionRef, {
                            uid: auth.currentUser.uid,
                            type,
                            updatedAt: FB.serverTimestamp()
                        });
                    }

                    await renderSocial();
                } catch (error) {
                    console.error(error);
                    alert('Could not save your reaction. Check Firestore rules.');
                }
            };
        });

    // LOGIN STATUS
    commentHintEl.textContent = loggedIn
        ? 'Join the discussion.'
        : 'Log in to comment or vote.';

    // SORT CONTROLS + COMMENT COUNT
    commentFormEl.innerHTML = `
        <div class="commentcomposer">
            ${loggedIn ? `
                <textarea
                    id="newCommentText"
                    class="field"
                    maxlength="2000"
                    rows="3"
                    placeholder="Write a comment..."
                ></textarea>
                <button id="submitNewComment" class="btn" type="button">
                    Post comment
                </button>
            ` : `
                <p class="muted">
                    <a href="/auth/login">Log in</a> to join the discussion.
                </p>
            `}
        </div>
    `;

    commentListEl.innerHTML = `
        <div class="comment-toolbar">
            <strong>${commentsSnapshot.size} comments</strong>
            <select id="commentSort" class="field" style="width:auto;margin:0">
                <option value="best">Best</option>
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
            </select>
        </div>
        <div id="commentItems"></div>
    `;

    const commentItemsEl = document.getElementById('commentItems');
    const sortEl = document.getElementById('commentSort');

    // LOAD REPLIES AND VOTES
    const comments = await Promise.all(
        commentsSnapshot.docs.map(async item => {
            const data = item.data();
            const repliesRef = FB.collection(
                db, ...chapterPath, 'comments',
                item.id, 'replies'
            );
            const votesRef = FB.collection(
                db, ...chapterPath, 'comments',
                item.id, 'votes'
            );

            const [repliesSnap, votesSnap] = await Promise.all([
                FB.getDocs(repliesRef),
                FB.getDocs(votesRef)
            ]);

            let likes = 0;
            let dislikes = 0;
            let myVote = 0;

            votesSnap.forEach(voteDoc => {
                const vote = voteDoc.data();

                if (vote.value === 1) likes++;
                if (vote.value === -1) dislikes++;

                if (loggedIn && voteDoc.id === user.uid) {
                    myVote = vote.value;
                }
            });

            return {
                id: item.id,
                ...data,
                replies: repliesSnap.docs.map(reply => ({
                    id: reply.id,
                    ...reply.data()
                })),
                likes,
                dislikes,
                myVote,
                score: likes - dislikes
            };
        })
    );

    const expanded = new Set();
    const replyForms = new Set();

    function timeOf(item) {
        return item.createdAt?.toMillis
            ? item.createdAt.toMillis()
            : 0;
    }

    function safeDate(item) {
        return item.createdAt?.toDate
            ? item.createdAt.toDate().toLocaleString()
            : 'Just now';
    }

    function renderReplies(comment) {
        if (!expanded.has(comment.id)) return '';

        return `
            <div class="comment-replies">
                ${comment.replies.map(reply => `
                    <article class="comment reply-comment">
                        <div class="commenthead">
                            <strong>${esc(reply.username || 'Reader')}</strong>
                            <span class="muted">${esc(safeDate(reply))}</span>
                        </div>
                        <div class="comment-body">${esc(reply.text || '')}</div>
                        ${loggedIn && user.uid === reply.uid ? `
                            <button class="linkbtn"
                                type="button"
                                data-delete-reply="${esc(comment.id)}|${esc(reply.id)}">
                                Delete
                            </button>
                        ` : ''}
                    </article>
                `).join('')}
            </div>
        `;
    }

    function renderComment(comment) {
        return `
            <article class="comment" data-comment-id="${esc(comment.id)}">
                <div class="commenthead">
                    <strong>${esc(comment.username || 'Reader')}</strong>
                    <span class="muted">${esc(safeDate(comment))}</span>
                </div>

                <div class="comment-body">${esc(comment.text || '')}</div>

                <div class="comment-actions">
                    <button class="linkbtn ${comment.myVote === 1 ? 'active' : ''}"
                        type="button" data-vote="${esc(comment.id)}" data-value="1">
                        👍 ${comment.likes}
                    </button>
                    <button class="linkbtn ${comment.myVote === -1 ? 'active' : ''}"
                        type="button" data-vote="${esc(comment.id)}" data-value="-1">
                        👎 ${comment.dislikes}
                    </button>

                    ${loggedIn ? `
                        <button class="linkbtn" type="button"
                            data-reply-form="${esc(comment.id)}">
                            Reply
                        </button>
                    ` : ''}

                    ${comment.replies.length ? `
                        <button class="linkbtn" type="button"
                            data-toggle-replies="${esc(comment.id)}">
                            ${expanded.has(comment.id) ? 'Hide replies' : 'Show replies'}
                            (${comment.replies.length})
                        </button>
                    ` : ''}

                    ${loggedIn && user.uid === comment.uid ? `
                        <button class="linkbtn" type="button"
                            data-delete-comment="${esc(comment.id)}">
                            Delete
                        </button>
                    ` : ''}
                </div>

                ${replyForms.has(comment.id) && loggedIn ? `
                    <div class="reply-composer">
                        <textarea class="field" rows="2" maxlength="2000"
                            id="replyText-${esc(comment.id)}"
                            placeholder="Write a reply..."></textarea>
                        <button class="btn" type="button"
                            data-submit-reply="${esc(comment.id)}">
                            Post reply
                        </button>
                        <button class="linkbtn" type="button"
                            data-cancel-reply="${esc(comment.id)}">
                            Cancel
                        </button>
                    </div>
                ` : ''}

                ${renderReplies(comment)}
            </article>
        `;
    }

    function drawComments() {
        const sorted = [...comments];

        if (sortEl.value === 'newest') {
            sorted.sort((a, b) => timeOf(b) - timeOf(a));
        } else if (sortEl.value === 'oldest') {
            sorted.sort((a, b) => timeOf(a) - timeOf(b));
        } else {
            sorted.sort((a, b) =>
                (b.score - a.score) || (timeOf(b) - timeOf(a))
            );
        }

        commentItemsEl.innerHTML = sorted.length
            ? sorted.map(renderComment).join('')
            : '<div class="empty">No comments yet. Be the first!</div>';

        // VOTE
        commentItemsEl.querySelectorAll('[data-vote]').forEach(button => {
            button.onclick = async () => {
                if (!auth?.currentUser) {
                    location.href = '/auth/login';
                    return;
                }

                const commentId = button.dataset.vote;
                const value = Number(button.dataset.value);
                const voteRef = FB.doc(
                    db, ...chapterPath,
                    'comments', commentId,
                    'votes', auth.currentUser.uid
                );

                try {
                    const existing = await FB.getDoc(voteRef);

                    if (existing.exists() &&
                        existing.data().value === value) {
                        await FB.deleteDoc(voteRef);
                    } else {
                        await FB.setDoc(voteRef, {
                            uid: auth.currentUser.uid,
                            value,
                            updatedAt: FB.serverTimestamp()
                        });
                    }

                    await renderSocial();
                } catch (error) {
                    console.error(error);
                    alert('Could not vote. Check Firestore rules.');
                }
            };
        });

        // REPLY FORM
        commentItemsEl.querySelectorAll('[data-reply-form]').forEach(button => {
            button.onclick = () => {
                const id = button.dataset.replyForm;
                replyForms.has(id) ? replyForms.delete(id) : replyForms.add(id);
                drawComments();
            };
        });

        commentItemsEl.querySelectorAll('[data-cancel-reply]').forEach(button => {
            button.onclick = () => {
                replyForms.delete(button.dataset.cancelReply);
                drawComments();
            };
        });

        // SHOW / HIDE REPLIES
        commentItemsEl.querySelectorAll('[data-toggle-replies]').forEach(button => {
            button.onclick = () => {
                const id = button.dataset.toggleReplies;
                expanded.has(id) ? expanded.delete(id) : expanded.add(id);
                drawComments();
            };
        });

        // POST REPLY
        commentItemsEl.querySelectorAll('[data-submit-reply]').forEach(button => {
            button.onclick = async () => {
                const currentUser = auth?.currentUser;
                if (!currentUser) {
                    location.href = '/auth/login';
                    return;
                }

                const parentId = button.dataset.submitReply;
                const textarea = document.getElementById(`replyText-${parentId}`);
                const text = textarea?.value.trim();

                if (!text) return;

                button.disabled = true;

                try {
                    await FB.addDoc(
                        FB.collection(
                            db, ...chapterPath,
                            'comments', parentId, 'replies'
                        ),
                        {
                            uid: currentUser.uid,
                            username: currentUser.displayName || 'Reader',
                            text,
                            createdAt: FB.serverTimestamp()
                        }
                    );

                    expanded.add(parentId);
                    replyForms.delete(parentId);
                    await renderSocial();
                } catch (error) {
                    console.error(error);
                    alert('Could not post reply. Check Firestore rules.');
                    button.disabled = false;
                }
            };
        });

        // DELETE REPLY
        commentItemsEl.querySelectorAll('[data-delete-reply]').forEach(button => {
            button.onclick = async () => {
                const [parentId, replyId] = button.dataset.deleteReply.split('|');

                if (!confirm('Delete this reply?')) return;

                try {
                    await FB.deleteDoc(FB.doc(
                        db, ...chapterPath,
                        'comments', parentId, 'replies', replyId
                    ));
                    await renderSocial();
                } catch (error) {
                    console.error(error);
                    alert('Could not delete reply. Check Firestore rules.');
                }
            };
        });

        // DELETE COMMENT AND ITS REPLIES/VOTES
        commentItemsEl.querySelectorAll('[data-delete-comment]').forEach(button => {
            button.onclick = async () => {
                const commentId = button.dataset.deleteComment;
                if (!confirm('Delete this comment and its replies?')) return;

                try {
                    const repliesRef = FB.collection(
                        db, ...chapterPath, 'comments', commentId, 'replies'
                    );
                    const votesRef = FB.collection(
                        db, ...chapterPath, 'comments', commentId, 'votes'
                    );

                    const [replies, votes] = await Promise.all([
                        FB.getDocs(repliesRef),
                        FB.getDocs(votesRef)
                    ]);

                    // Firestore does not automatically delete subcollections.
                    for (const item of [...replies.docs, ...votes.docs]) {
                        await FB.deleteDoc(item.ref);
                    }

                    await FB.deleteDoc(FB.doc(
                        db, ...chapterPath, 'comments', commentId
                    ));

                    await renderSocial();
                } catch (error) {
                    console.error(error);
                    alert('Could not delete comment. Check Firestore rules.');
                }
            };
        });
    }

    sortEl.onchange = drawComments;

    // POST TOP-LEVEL COMMENT
    const submitButton = document.getElementById('submitNewComment');

    if (submitButton) {
        submitButton.onclick = async () => {
            const currentUser = auth?.currentUser;
            if (!currentUser) {
                location.href = '/auth/login';
                return;
            }

            const textarea = document.getElementById('newCommentText');
            const text = textarea?.value.trim();

            if (!text) {
                textarea?.focus();
                return;
            }

            submitButton.disabled = true;

            try {
                await FB.addDoc(commentsRef, {
                    uid: currentUser.uid,
                    username: currentUser.displayName || 'Reader',
                    text,
                    createdAt: FB.serverTimestamp()
                });

                await renderSocial();
            } catch (error) {
                console.error(error);
                alert('Could not post comment. Check Firestore rules.');
                submitButton.disabled = false;
            }
        };
    }

    drawComments();
}

    </script>

</body>
</html>
