<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reader — Maru Manhwa</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="reader">

    <div class="readerbar">
        <div class="readerin">

            <a class="btn secondary" id="back">←</a>

            <div class="grow" id="name">
                Reader
            </div>

            <select id="chapters" class="field" style="width:auto;margin:0"></select>

            <button class="btn secondary" id="top">
                ↑
            </button>

        </div>
    </div>


    <!-- CHAPTER PAGES -->
    <main class="pages" id="pages"></main>


    <!-- REACTIONS + COMMENTS -->
    <section class="reader-social container">

        <div class="reactionbox">
            <h2>React to this chapter</h2>
            <div id="reactions" class="reactions"></div>
        </div>

        <div class="comments">

            <div class="sectionhead">
                <h2>Comments</h2>
                <span id="commentHint" class="muted"></span>
            </div>

            <div id="commentForm"></div>

            <div id="commentList" class="commentlist"></div>

        </div>

    </section>


    <div id="footer"></div>


    <script type="module">

        import {
            getSeries,
            saveHistory,
            esc,
            footer
        } from '/js/app.js';

        import {
            db,
            FB,
            auth,
            firebaseReady
        } from '/js/firebase.js';


        /* --------------------------------
           ELEMENTS
        -------------------------------- */

        const pagesEl = document.getElementById('pages');
        const nameEl = document.getElementById('name');
        const chaptersEl = document.getElementById('chapters');
        const backEl = document.getElementById('back');
        const topEl = document.getElementById('top');

        const reactionsEl = document.getElementById('reactions');
        const commentHintEl = document.getElementById('commentHint');
        const commentFormEl = document.getElementById('commentForm');
        const commentListEl = document.getElementById('commentList');

        const footerEl = document.getElementById('footer');
        
        async function requireVerifiedEmail() {
            const currentUser = auth?.currentUser;

            if (!currentUser) {
                location.href = '/auth/login';
                return false;
            }

            try {
                await FB.reload(currentUser);
            } catch (error) {
                console.error('Could not refresh user status:', error);
                alert('Could not check your email verification. Please try again.');
                return false;
            }

            if (!auth.currentUser?.emailVerified) {
                alert('Please verify your email to like, react, comment, or reply. Visit your profile to send a verification email.');
                return false;
            }

            return true;
        }


        /* --------------------------------
           URL
        -------------------------------- */

        const params = new URLSearchParams(location.search);

        const sid = params.get('series') || 'solo-leveling';

        const chapterId =
            params.get('chapter') || '1';


        /* --------------------------------
           GET SERIES
        -------------------------------- */

        const series = await getSeries(sid);

        if (!series) {

            pagesEl.innerHTML = `
                <div class="empty">
                    Manhwa not found.
                </div>
            `;

            throw new Error('Series not found');

        }


        /* --------------------------------
           GET CHAPTERS
        -------------------------------- */

        let chapters = [];


        if (firebaseReady) {

            try {

                const snapshot = await FB.getDocs(
                    FB.query(
                        FB.collection(
                            db,
                            'series',
                            sid,
                            'chapters'
                        ),
                        FB.orderBy('number', 'asc')
                    )
                );


                chapters = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));


            } catch (error) {

                console.error(
                    'Could not load chapters:',
                    error
                );

            }

        }


        /* --------------------------------
           DEMO FALLBACK
        -------------------------------- */

        if (!chapters.length) {

            chapters = Array.from(
                {
                    length: Math.min(
                        Number(series.chapters) || 1,
                        30
                    )
                },
                (_, index) => ({

                    id: String(index + 1),

                    number: index + 1,

                    title: `Chapter ${index + 1}`,

                    pages: []

                })
            );

        }


        /* --------------------------------
           CURRENT CHAPTER
        -------------------------------- */

        let currentChapter =
            chapters.find(
                chapter =>
                    String(chapter.id) ===
                    String(chapterId)
            );


        if (!currentChapter) {

            currentChapter = chapters[0];

        }


        /* --------------------------------
           HEADER
        -------------------------------- */

        nameEl.textContent =
            `${series.title} — Chapter ${currentChapter.number}`;


        backEl.href =
            `series?id=${encodeURIComponent(sid)}`;


        topEl.onclick = () => {

            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });

        };


        /* --------------------------------
           CHAPTER SELECTOR
        -------------------------------- */

        chaptersEl.innerHTML =
            chapters
                .map(chapter => {

                    const selected =
                        String(chapter.id) ===
                        String(currentChapter.id)
                            ? 'selected'
                            : '';

                    return `
                        <option
                            value="${esc(chapter.id)}"
                            ${selected}
                        >
                            Chapter ${esc(chapter.number)}
                        </option>
                    `;

                })
                .join('');


        chaptersEl.onchange = event => {

            const newChapter =
                event.target.value;

            window.location.href =
                `reader?series=${encodeURIComponent(sid)}&chapter=${encodeURIComponent(newChapter)}`;

        };


        /* --------------------------------
           GET PAGE URLS
        -------------------------------- */

        let pageUrls = [];


        if (Array.isArray(currentChapter.pages)) {

            pageUrls = currentChapter.pages;

        }


        /*
           Also support alternative field names
           in case an older chapter was saved
           using one of these.
        */

        if (!pageUrls.length && Array.isArray(currentChapter.pageUrls)) {

            pageUrls = currentChapter.pageUrls;

        }


        if (!pageUrls.length && Array.isArray(currentChapter.images)) {

            pageUrls = currentChapter.images;

        }


        /* --------------------------------
           CLEAN PAGE URLS
        -------------------------------- */

        pageUrls = pageUrls
            .map(page => {

                if (typeof page === 'string') {

                    return page.trim();

                }

                if (page && typeof page.url === 'string') {

                    return page.url.trim();

                }

                return '';

            })
            .filter(Boolean);


        console.log(
            'Current chapter:',
            currentChapter
        );

        console.log(
            'Page URLs:',
            pageUrls
        );


        /* --------------------------------
           DISPLAY PAGES
        -------------------------------- */

        if (!pageUrls.length) {

            pagesEl.innerHTML = `
                <div class="empty reader-empty">

                    <h2>No chapter pages found</h2>

                    <p class="muted">
                        This chapter does not have any
                        image URLs saved in Firestore.
                    </p>

                    <p class="muted">
                        Add the GitHub image URLs to this chapter
                        from the Admin page.
                    </p>

                </div>
            `;

        } else {

            pagesEl.innerHTML =
                pageUrls
                    .map((url, index) => {

                        return `
                            <img
                                src="${esc(url)}"
                                loading="${index < 2 ? 'eager' : 'lazy'}"
                                alt="Chapter ${esc(currentChapter.number)} — Page ${index + 1}"
                                class="reader-page"
                                onerror="this.classList.add('image-error');"
                            >
                        `;

                    })
                    .join('');

        }


        /* --------------------------------
           SAVE READING HISTORY
        -------------------------------- */

        await saveHistory(
            series,
            currentChapter.number
        );


        /* --------------------------------
           FOOTER
        -------------------------------- */

        footerEl.innerHTML = footer();


        /* --------------------------------
           REACTIONS + COMMENTS
        -------------------------------- */

       


async function renderSocial() {
    if (!firebaseReady || !db) {
        commentHintEl.textContent = 'Comments are unavailable.';
        return;
    }

    const user = auth?.currentUser;
    const loggedIn = !!user;
    const base = ['series', sid, 'chapters', String(currentChapter.id)];
    const rootRef = FB.collection(db, ...base, 'comments');
    const voteViews = new Map();
    const replyForms = new Set();
    const profileCache = new Map();

    async function getUserProfile(uid) {
        if (!uid) {
            return {
                username: 'Reader',
                profilePic: '/assets/profile.png',
                role: 'Member'
            };
        }

        if (!profileCache.has(uid)) {
            const request = FB.getDoc(FB.doc(db, 'users', uid))
                .then(snapshot => {
                    const data = snapshot.exists() ? snapshot.data() : {};

                    return {
                        username: data.username || '',
                        profilePic: data.profilePic || '/assets/profile.png',
                        role: data.role || 'Member'
                    };
                })
                .catch(error => {
                    console.error('Could not load user profile:', error);
                    return {
                        username: '',
                        profilePic: '/assets/profile.png',
                        role: 'Member'
                    };
                });

            profileCache.set(uid, request);
        }

        return profileCache.get(uid);
    }

    // Relative time: no full date or timestamp
    function relativeTime(item) {
        const date = item.createdAt?.toDate
            ? item.createdAt.toDate().getTime()
            : Date.now();

        const seconds = Math.max(0, Math.floor((Date.now() - date) / 1000));

        if (seconds < 60) return 'just now';
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
        if (seconds < 604800) return `${Math.floor(seconds / 86400)}d ago`;
        if (seconds < 31536000) return `${Math.floor(seconds / 604800)}w ago`;
        if (seconds < 315360000) return `${Math.floor(seconds / 2592000)}mo ago`;
        return `${Math.floor(seconds / 31536000)}y ago`;
    }

    function timeValue(item) {
        return item.createdAt?.toMillis ? item.createdAt.toMillis() : 0;
    }

    function keyOf(path) {
        return encodeURIComponent(path);
    }

    function refFromPath(path) {
        return FB.doc(db, ...path.split('/'));
    }

    // Read a comment/reply, its votes and its own replies recursively
    async function loadNode(snapshotDoc) {
       const data = snapshotDoc.data();
const path = snapshotDoc.ref.path;
const profile = await getUserProfile(data.uid);


        const [votesSnap, repliesSnap] = await Promise.all([
            FB.getDocs(FB.collection(db, ...path.split('/'), 'votes')),
            FB.getDocs(FB.query(
                FB.collection(db, ...path.split('/'), 'replies'),
                FB.orderBy('createdAt', 'asc')
            ))
        ]);

        let likes = 0;
        let dislikes = 0;
        let myVote = 0;

        votesSnap.forEach(v => {
            const vote = v.data();
            if (vote.value === 1) likes++;
            if (vote.value === -1) dislikes++;
            if (loggedIn && v.id === user.uid) myVote = vote.value;
        });

        const replies = await Promise.all(
            repliesSnap.docs.map(loadNode)
        );

       
return {
    id: snapshotDoc.id,
    path,
    ...data,
    profile,
            likes,
            dislikes,
            myVote,
            score: likes - dislikes,
            replies
        };
    }

    // Chapter reactions remain unchanged
    const types = [
        ['like', '👍'],
        ['love', '❤️'],
        ['fire', '🔥'],
        ['funny', '😂']
    ];

    try {
        const [chapterVotes, commentsSnap] = await Promise.all([
            FB.getDocs(FB.collection(db, ...base, 'reactions')),
            FB.getDocs(FB.query(
                rootRef,
                FB.orderBy('createdAt', 'desc'),
                FB.limit(100)
            ))
        ]);

        const counts = Object.fromEntries(types.map(([type]) => [type, 0]));
        let myReaction = null;

        chapterVotes.forEach(d => {
            const type = d.data().type;
            if (counts[type] !== undefined) counts[type]++;
            if (loggedIn && d.id === user.uid) myReaction = type;
        });

        reactionsEl.innerHTML = types.map(([type, emoji]) => `
            <button type="button"
                class="reaction ${myReaction === type ? 'active' : ''}"
                data-chapter-reaction="${type}">
                ${emoji} <span>${counts[type]}</span>
            </button>
        `).join('');

        reactionsEl.querySelectorAll('[data-chapter-reaction]').forEach(btn => {
           
            btn.onclick = async () => {
                if (!(await requireVerifiedEmail())) {
                    return;
                }

                const reactionRef = FB.doc(
                    db, ...base, 'reactions', auth.currentUser.uid
                );

                try {
                    const existing = await FB.getDoc(reactionRef);
                    const type = btn.dataset.chapterReaction;

                    if (existing.exists() && existing.data().type === type) {
                        await FB.deleteDoc(reactionRef);
                    } else {
                        await FB.setDoc(reactionRef, {
                            uid: auth.currentUser.uid,
                            type,
                            updatedAt: FB.serverTimestamp()
                        });
                    }

                    await renderSocial();
                } catch (error) {
                    console.error(error);
                    alert('Could not save reaction.');
                }
            };
        });

        commentHintEl.textContent = loggedIn
            ? 'Join the discussion.'
            : 'Log in to comment or vote.';

        commentFormEl.innerHTML = loggedIn ? `
            <div class="commentcomposer">
                <textarea id="newCommentText" class="field"
                    maxlength="2000" rows="3"
                    placeholder="Write a comment..."></textarea>
                <button id="submitNewComment" class="btn" type="button">
                    Post comment
                </button>
            </div>
        ` : `
            <p class="muted"><a href="/auth/login">Log in</a> to join the discussion.</p>
        `;

        const comments = await Promise.all(commentsSnap.docs.map(loadNode));

        // Count top-level comments and all nested replies
        function countAll(nodes) {
            return nodes.reduce((total, node) =>
                total + 1 + countAll(node.replies), 0
            );
        }

        commentListEl.innerHTML = `
            <div class="comment-toolbar">
                <strong>${countAll(comments)} comments</strong>
                <select id="commentSort" class="field" style="width:auto;margin:0">
                    <option value="best">Best</option>
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                </select>
            </div>
            <div id="commentItems"></div>
        `;

        const itemsEl = document.getElementById('commentItems');
        const sortEl = document.getElementById('commentSort');

        // Preserve the selected sorting option after votes/replies refresh
        sortEl.value = window.marummCommentSort || 'best';
        sortEl.onchange = () => {
            window.marummCommentSort = sortEl.value;
            draw();
        };

        // Default view: first 3 replies. "hidden" hides all;
        // "all" expands all replies.
        function replyMode(node) {
            return voteViews.get(node.path) || 'preview';
        }

        function renderNode(node, isReply = false) {
            const key = keyOf(node.path);
            const mode = replyMode(node);
            const visibleReplies = mode === 'hidden'
                ? []
                : mode === 'all'
                    ? node.replies
                    : node.replies.slice(0, 3);

            const hasReplies = node.replies.length > 0;
            const remaining = node.replies.length - 3;

            const upIcon = `
                <svg class="vote-icon" viewBox="0 0 24 24"
                    aria-hidden="true" focusable="false">
                    <path d="M7 10v11H4V10h3Zm3 11h7.2a2 2 0 0 0 1.95-1.55l1.6-7A2 2 0 0 0 18.8 10H14l.7-3.2a2.3 2.3 0 0 0-1.1-2.5L12.5 4 8 10v9a2 2 0 0 0 2 2Z"/>
                </svg>`;

            const downIcon = `
                <svg class="vote-icon down" viewBox="0 0 24 24"
                    aria-hidden="true" focusable="false">
                    <path d="M7 14V3H4v11h3Zm3-11h7.2a2 2 0 0 1 1.95 1.55l1.6 7A2 2 0 0 1 18.8 14H14l.7 3.2a2.3 2.3 0 0 1-1.1 2.5l-1.1.3L8 14V5a2 2 0 0 1 2-2Z"/>
                </svg>`;

            return `
                <article class="comment ${isReply ? 'reply-comment' : ''}">     
<div class="commenthead">
    <img
        class="comment-avatar"
        src="${esc(node.profile?.profilePic || '/assets/profile.png')}"
        alt=""
        loading="lazy"
        onerror="this.onerror=null;this.src='/assets/profile.png';"
    >

    <div class="comment-author">
        <div class="comment-author-line">
            <strong>${esc(node.profile?.username || node.username || 'Reader')}</strong>

            <span class="comment-role role-${esc(
                String(node.profile?.role || 'Member').toLowerCase().replace(/[^a-z0-9_-]/g, '')
            )}">
                ${esc(node.profile?.role || 'Member')}
            </span>
        </div>

        <span class="muted comment-time"
            title="${esc(relativeTime(node))}">
            ${esc(relativeTime(node))}
        </span>
    </div>
</div>


                    <div class="comment-body">${esc(node.text || '')}</div>

                    <div class="comment-actions">
                        <button type="button"
                            class="vote-button ${node.myVote === 1 ? 'active' : ''}"
                            aria-label="Like"
                            title="Like"
                            data-vote="${key}" data-value="1">
                            ${upIcon}<span>${node.likes}</span>
                        </button>

                        <button type="button"
                            class="vote-button ${node.myVote === -1 ? 'active dislike-active' : ''}"
                            aria-label="Dislike"
                            title="Dislike"
                            data-vote="${key}" data-value="-1">
                            ${downIcon}<span>${node.dislikes}</span>
                        </button>

                        ${loggedIn ? `
                            <button type="button" class="linkbtn"
                                data-reply="${key}">Reply</button>
                        ` : ''}

                        ${loggedIn && user.uid === node.uid ? `
                            <button type="button" class="linkbtn"
                                data-delete="${key}">Delete</button>
                        ` : ''}
                    </div>

                    ${replyForms.has(node.path) && loggedIn ? `
                        <div class="reply-composer">
                            <textarea class="field" rows="2" maxlength="2000"
                                id="replyText-${key}"
                                placeholder="Write a reply..."></textarea>
                            <button type="button" class="btn"
                                data-send-reply="${key}">Post reply</button>
                            <button type="button" class="linkbtn"
                                data-cancel-reply="${key}">Cancel</button>
                        </div>
                    ` : ''}

                    ${hasReplies ? `
                        <div class="comment-replies">
                            ${visibleReplies.map(reply => renderNode(reply, true)).join('')}
                        </div>
                        <div class="reply-list-actions">
                            ${mode === 'hidden' ? `
                                <button type="button" class="linkbtn"
                                    data-show-replies="${key}">
                                    Show replies (${node.replies.length})
                                </button>
                            ` : mode === 'all' ? `
                                <button type="button" class="linkbtn"
                                    data-hide-replies="${key}">
                                    Hide replies
                                </button>
                            ` : `
                                ${remaining > 0 ? `
                                    <button type="button" class="linkbtn"
                                        data-more-replies="${key}">
                                        Show more replies (${remaining})
                                    </button>
                                ` : ''}
                                <button type="button" class="linkbtn"
                                    data-hide-replies="${key}">
                                    Hide replies
                                </button>
                            `}
                        </div>
                    ` : ''}
                </article>
            `;
        }

        function draw() {
            const sorted = [...comments];
            const sort = sortEl.value;

            if (sort === 'newest') {
                sorted.sort((a, b) => timeValue(b) - timeValue(a));
            } else if (sort === 'oldest') {
                sorted.sort((a, b) => timeValue(a) - timeValue(b));
            } else {
                sorted.sort((a, b) =>
                    (b.score - a.score) || (timeValue(b) - timeValue(a))
                );
            }

            itemsEl.innerHTML = sorted.length
                ? sorted.map(node => renderNode(node)).join('')
                : '<div class="empty">No comments yet. Be the first!</div>';

            // Like / dislike any comment or reply
            itemsEl.querySelectorAll('[data-vote]').forEach(btn => {
               
                btn.onclick = async () => {
                    if (!(await requireVerifiedEmail())) {
                        return;
                    }

                    const path = decodeURIComponent(btn.dataset.vote);
                    const value = Number(btn.dataset.value);
                    const voteRef = FB.doc(
                        db, ...path.split('/'), 'votes', auth.currentUser.uid
                    );

                    try {
                        const old = await FB.getDoc(voteRef);

                        if (old.exists() && old.data().value === value) {
                            await FB.deleteDoc(voteRef);
                        } else {
                            await FB.setDoc(voteRef, {
                                uid: auth.currentUser.uid,
                                value,
                                updatedAt: FB.serverTimestamp()
                            });
                        }

                        await renderSocial();
                    } catch (error) {
                        console.error(error);
                        alert('Could not save vote. Check Firestore rules.');
                    }
                };
            });

            itemsEl.querySelectorAll('[data-reply]').forEach(btn => {
                btn.onclick = () => {
                    const path = decodeURIComponent(btn.dataset.reply);
                    replyForms.has(path)
                        ? replyForms.delete(path)
                        : replyForms.add(path);
                    draw();
                };
            });

            itemsEl.querySelectorAll('[data-cancel-reply]').forEach(btn => {
                btn.onclick = () => {
                    replyForms.delete(decodeURIComponent(btn.dataset.cancelReply));
                    draw();
                };
            });

            itemsEl.querySelectorAll('[data-more-replies]').forEach(btn => {
                btn.onclick = () => {
                    voteViews.set(decodeURIComponent(btn.dataset.moreReplies), 'all');
                    draw();
                };
            });

            itemsEl.querySelectorAll('[data-hide-replies]').forEach(btn => {
                btn.onclick = () => {
                    voteViews.set(decodeURIComponent(btn.dataset.hideReplies), 'hidden');
                    draw();
                };
            });

            itemsEl.querySelectorAll('[data-show-replies]').forEach(btn => {
                btn.onclick = () => {
                    voteViews.set(decodeURIComponent(btn.dataset.showReplies), 'preview');
                    draw();
                };
            });

            // Reply to a comment OR another reply
            itemsEl.querySelectorAll('[data-send-reply]').forEach(btn => {
                btn.onclick = async () => {
                   
                    if (!(await requireVerifiedEmail())) {
                        return;
                    }

                    const currentUser = auth.currentUser;

                    const parentPath = decodeURIComponent(btn.dataset.sendReply);
                    const textarea = document.getElementById(`replyText-${btn.dataset.sendReply}`);
                    const text = textarea?.value.trim();
                    if (!text) return;

                    btn.disabled = true;

                    try {
                        await FB.addDoc(
                            FB.collection(db, ...parentPath.split('/'), 'replies'),
                            {
                                uid: currentUser.uid,
                                username: currentUser.displayName || 'Reader',
                                text,
                                createdAt: FB.serverTimestamp()
                            }
                        );

                        voteViews.set(parentPath, 'preview');
                        replyForms.delete(parentPath);
                        await renderSocial();
                    } catch (error) {
                        console.error(error);
                        alert('Could not post reply. Check Firestore rules.');
                        btn.disabled = false;
                    }
                };
            });

            // Delete your own comment/reply and its nested content
            async function deleteTree(path) {
                const ref = refFromPath(path);

                const [replies, votes] = await Promise.all([
                    FB.getDocs(FB.collection(db, ...path.split('/'), 'replies')),
                    FB.getDocs(FB.collection(db, ...path.split('/'), 'votes'))
                ]);

                for (const reply of replies.docs) {
                    await deleteTree(reply.ref.path);
                }

                for (const vote of votes.docs) {
                    await FB.deleteDoc(vote.ref);
                }

                await FB.deleteDoc(ref);
            }

            itemsEl.querySelectorAll('[data-delete]').forEach(btn => {
                btn.onclick = async () => {
                    const path = decodeURIComponent(btn.dataset.delete);
                    if (!confirm('Delete this comment and all its replies?')) return;

                    try {
                        await deleteTree(path);
                        await renderSocial();
                    } catch (error) {
                        console.error(error);
                        alert('Could not delete. Check Firestore rules.');
                    }
                };
            });
        }

        // Post a new top-level comment
        const postBtn = document.getElementById('submitNewComment');

        if (postBtn) {
            postBtn.onclick = async () => {
               
                if (!(await requireVerifiedEmail())) {
                    return;
                }

                const currentUser = auth.currentUser;

                const textarea = document.getElementById('newCommentText');
                const text = textarea?.value.trim();
                if (!text) {
                    textarea?.focus();
                    return;
                }

                postBtn.disabled = true;

                try {
                    await FB.addDoc(rootRef, {
                        uid: currentUser.uid,
                        username: currentUser.displayName || 'Reader',
                        text,
                        createdAt: FB.serverTimestamp()
                    });

                    await renderSocial();
                } catch (error) {
                    console.error(error);
                    alert('Could not post comment. Check Firestore rules.');
                    postBtn.disabled = false;
                }
            };
        }

        draw();
    } catch (error) {
        console.error('Comments failed to load:', error);
        commentHintEl.textContent = 'Could not load comments. Check Firestore rules.';
    }
}
await renderSocial();

    </script>
