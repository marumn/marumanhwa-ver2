<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse — Maru Manhwa</title><link rel="stylesheet" href="css/style.css"></head><body><div id="nav"></div><main class="page"><div class="container"><div class="sectionhead"><h1>Browse</h1><select id="genre" class="field" style="width:auto"><option value="">All genres</option><option>Action</option><option>Fantasy</option><option>Romance</option><option>Adventure</option><option>Drama</option></select></div><div id="grid" class="grid"></div></div></main><div id="footer"></div><script type="module">import {footer,nav,listSeries,card} from './js/app.js';nav();let all=await listSeries();let p=new URLSearchParams(location.search);let q=(p.get('q')||'').toLowerCase();genre.value=p.get('genre')||'';function render(){let g=genre.value;let a=all.filter(s=>(!q||s.title.toLowerCase().includes(q))&&(!g||s.genres?.includes(g)));grid.innerHTML=a.length?a.map(card).join(''):'<div class="empty">No series found.</div>'}genre.onchange=render;render();footerEl.innerHTML=footer();</script></body></html>
