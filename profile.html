<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — Maru Manhwa</title><link rel="stylesheet" href="css/style.css"></head><body><div id="nav"></div><main class="page"><div class="container"><h1>My Library</h1><div class="section"><h2>Bookmarks</h2><div id="bookmarks" class="grid"></div></div><div class="section"><h2>Continue Reading</h2><div id="history" class="grid"></div></div></div></main><div id="footer"></div><script type="module">import {footer,nav,card} from './js/app.js';import {auth,db,FB} from './js/firebase.js';nav();if(!auth){location.href='auth/login.html'}else FB.onAuthStateChanged(auth,async u=>{if(!u)return;let b=await FB.getDocs(FB.collection(db,'users',u.uid,'bookmarks'));bookmarks.innerHTML=b.empty?'<div class="empty">No bookmarks yet.</div>':b.docs.map(d=>card(d.data())).join('');let h=await FB.getDocs(FB.query(FB.collection(db,'users',u.uid,'history'),FB.orderBy('updatedAt','desc')));history.innerHTML=h.empty?'<div class="empty">Nothing to continue.</div>':h.docs.map(d=>`<a class="card" href="reader.html?series=${d.data().seriesId}"><div class="cover"><img src="${d.data().cover}"></div><div class="cardbody"><div class="title">${d.data().title}</div><div class="meta">Continue at Chapter ${d.data().lastChapter}</div></div></a>`).join('')});footerEl.innerHTML=footer();</script></body></html>
