<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Account — Maru Manhwa</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div id="nav"></div>


    <main class="page">

        <div class="container">

            <section class="account-header">

                <div class="account-avatar">
                    <img
                        id="profileAvatar"
                        src="/assets/profile.png"
                        alt="Profile"
                    >
                </div>

                <div class="account-info">

                    <h1 id="profileName">
                        Account
                    </h1>

                    <p id="profileEmail" class="muted">
                        Loading...
                    </p>

                    <div class="account-actions">

                        <button
                            id="logoutButton"
                            class="btn secondary"
                            type="button"
                        >
                            Log Out
                        </button>

                        <a
                            id="adminButton"
                            class="btn"
                            href="/admin"
                            style="display: none;"
                        >
                            Admin Panel
                        </a>

                    </div>

                </div>

           
            </section>

            <section
    id="emailVerificationNotice"
    class="account-header"
    style="display: none;"
>
                <h2>Verify your email to rate and comment</h2>

                <p class="muted">
                    We will send a verification link to your current
                    email address. This uses the same verification
                    flow as the comment section.
                </p>

                <p id="verificationStatus" class="muted"></p>

                <button
                    id="sendVerificationButton"
                    class="btn"
                    type="button"
                >
                    Send verification email
                </button>

                <button
                    id="refreshVerificationButton"
                    class="btn secondary"
                    type="button"
                    style="margin-top: 8px;"
                >
                    I've verified — refresh status
                </button>
            </section>

            <section class="section">

                <div class="sectionhead">
                    <h2>My Library</h2>
                </div>


                <div class="library-section">

                    <h3>Bookmarks</h3>

                    <div
                        id="bookmarks"
                        class="grid"
                    ></div>

                </div>


                <div class="library-section">

                    <h3>Continue Reading</h3>

                    <div
                        id="history"
                        class="grid"
                    ></div>

                </div>

            </section>

        </div>

    </main>


    <div id="footer"></div>


    <script type="module">

        import {
            footer,
            nav,
            card,
            esc
        } from '/js/app.js';

      
        import {
            auth,
            db,
            FB,
            firebaseReady
        } from '/js/firebase.js';



        nav();



        const profileName = document.getElementById('profileName');
        const profileEmail = document.getElementById('profileEmail');
        const profileAvatar = document.getElementById('profileAvatar');

        const logoutButton = document.getElementById('logoutButton');
        const adminButton = document.getElementById('adminButton');
        const verificationNotice =
            document.getElementById('emailVerificationNotice');
        const verificationStatus =
            document.getElementById('verificationStatus');
        const sendVerificationButton =
            document.getElementById('sendVerificationButton');
        const refreshVerificationButton =
            document.getElementById('refreshVerificationButton');


        const bookmarks = document.getElementById('bookmarks');
        const history = document.getElementById('history');

        const footerElement = document.getElementById('footer');


   

        footerElement.innerHTML = footer();

        async function refreshVerificationStatus() {
            const user = auth?.currentUser;

            if (!user) return;

            try {
                await FB.reload(user);

                if (user.emailVerified) {
                    verificationNotice.style.display = 'none';
                    verificationStatus.textContent = '';
                } else {
                    verificationNotice.style.display = 'block';

                    verificationStatus.textContent =
                        'Your email is not verified yet.';
                }
            } catch (error) {
                console.error('Verification refresh failed:', error);

                verificationStatus.textContent =
                    'Could not refresh your status. Please try again.';
            }
        }

        sendVerificationButton.addEventListener('click', async () => {
            const user = auth?.currentUser;

            if (!user) {
                window.location.href = '/auth/login';
                return;
            }

            try {
                await FB.reload(user);

                if (user.emailVerified) {
                    await refreshVerificationStatus();

                    verificationStatus.textContent =
                        'Your email is already verified!';

                    return;
                }

                sendVerificationButton.disabled = true;

                await FB.sendEmailVerification(user);

                verificationStatus.textContent =
                    'Verification email sent to ' + user.email +
                    '. Check your inbox and spam folder.';

            } catch (error) {
                console.error('Verification email failed:', error);

                verificationStatus.textContent =
                    error.code === 'auth/too-many-requests'
                        ? 'Too many attempts. Please wait before trying again.'
                        : 'Could not send the email. Please try again.';

            } finally {
                sendVerificationButton.disabled = false;
            }
        });

        refreshVerificationButton.addEventListener('click', async () => {
            refreshVerificationButton.disabled = true;

            await refreshVerificationStatus();

            refreshVerificationButton.disabled = false;
        });


    
        if (!auth) {

            window.location.href = '/auth/login';

        } else {

            FB.onAuthStateChanged(auth, async (user) => {



                if (!user) {

                    window.location.href = '/auth/login';

                    return;
                }

                await refreshVerificationStatus();
          

                profileName.textContent =
                    user.displayName ||
                    'Maru Member';

                profileEmail.textContent =
                    user.email || '';


              

                if (user.photoURL) {

                    profileAvatar.src = user.photoURL;

                } else {

                    profileAvatar.src =
                        '/assets/profile.png';
                }


                /*
                 * Check Firestore user document
                 */

                try {

                    const userRef = FB.doc(
                        db,
                        'users',
                        user.uid
                    );

                    const userSnap =
                        await FB.getDoc(userRef);


                    if (userSnap.exists()) {

                        const userData =
                            userSnap.data();


                        /*
                         * Use username from Firestore
                         * if available.
                         */

                        if (userData.username) {

                            profileName.textContent =
                                userData.username;
                        }


                        if (userData.role === 'admin') {

                            adminButton.style.display =
                                'inline-flex';
                        }

                    }

                } catch (error) {

                    console.error(
                        'Could not load account:',
                        error
                    );

                }


                /*
                 * Load bookmarks
                 */

                try {

                    const bookmarkQuery =
                        FB.collection(
                            db,
                            'users',
                            user.uid,
                            'bookmarks'
                        );

                    const bookmarkSnapshot =
                        await FB.getDocs(bookmarkQuery);


                    if (bookmarkSnapshot.empty) {

                        bookmarks.innerHTML = `
                            <div class="empty">
                                No bookmarks yet.
                            </div>
                        `;

                    } else {

                        bookmarks.innerHTML =
                            bookmarkSnapshot.docs
                                .map(document => {
                                    return card(
                                        document.data()
                                    );
                                })
                                .join('');

                    }

                } catch (error) {

                    console.error(
                        'Could not load bookmarks:',
                        error
                    );

                    bookmarks.innerHTML = `
                        <div class="empty">
                            Could not load bookmarks.
                        </div>
                    `;
                }


                /*
                 * Load reading history
                 */

                try {

                    const historyQuery =
                        FB.query(
                            FB.collection(
                                db,
                                'users',
                                user.uid,
                                'history'
                            ),
                            FB.orderBy(
                                'updatedAt',
                                'desc'
                            )
                        );

                    const historySnapshot =
                        await FB.getDocs(
                            historyQuery
                        );


                    if (historySnapshot.empty) {

                        history.innerHTML = `
                            <div class="empty">
                                Nothing to continue.
                            </div>
                        `;

                    } else {

                        history.innerHTML =
                            historySnapshot.docs
                                .map(document => {

                                    const data =
                                        document.data();

                                    return `
                                        <a
                                            class="card"
                                            href="reader?series=${encodeURIComponent(data.seriesId)}"
                                        >

                                            <div class="cover">

                                                <img
                                                    src="${esc(data.cover || '/assets/placeholder.svg')}"
                                                    alt="${esc(data.title || 'Manhwa')}"
                                                    loading="lazy"
                                                >

                                            </div>

                                            <div class="cardbody">

                                                <div class="title">
                                                    ${esc(data.title || 'Untitled')}
                                                </div>

                                                <div class="meta">
                                                    Continue at Chapter
                                                    ${esc(data.lastChapter || '1')}
                                                </div>

                                            </div>

                                        </a>
                                    `;

                                })
                                .join('');

                    }

                } catch (error) {

                    console.error(
                        'Could not load reading history:',
                        error
                    );

                    history.innerHTML = `
                        <div class="empty">
                            Could not load reading history.
                        </div>
                    `;
                }

            });

        }


        /*
         * Logout
         */

        logoutButton.addEventListener(
            'click',
            async () => {

                try {

                    await FB.signOut(auth);

                    window.location.href =
                        '/';

                } catch (error) {

                    console.error(
                        'Logout failed:',
                        error
                    );

                    alert(
                        'Could not log out. Please try again.'
                    );
                }

            }
        );

    </script>

</body>

</html>
