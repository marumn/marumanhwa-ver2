<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login — Maru Manhwa</title>
    <link rel="stylesheet" href="/css/style.css">
    
<style>
    body {
        background: #0b0d12;
    }

    .authbox-new {
        box-sizing: border-box;
        width: calc(100% - 32px);
        max-width: 480px;
        margin: 48px auto;
        padding: 36px;
        color: #f5f5f7;
        background: #101319;
        border: 1px solid #303744;
        border-radius: 16px;
        box-shadow: 0 18px 60px #0005;
    }

    .auth-heading {
        text-align: center;
        margin-bottom: 30px;
    }

    .auth-eyebrow {
        color: #ff4d7d;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.8px;
        margin: 0 0 12px;
    }

    .auth-heading h1 {
        color: #fff;
        font-size: 30px;
        line-height: 1.2;
        margin: 0 0 12px;
    }

    .auth-heading .muted {
        margin: 0;
        line-height: 1.6;
    }

    .authbox-new .field {
        box-sizing: border-box;
        width: 100%;
        min-height: 58px;
        margin: 0 0 16px;
        padding: 15px 17px;
        color: #fff;
        background: #191e27;
        border: 1px solid #303744;
        border-radius: 12px;
        font-size: 15px;
    }

    .authbox-new .field::placeholder {
        color: #929eb0;
    }

    .auth-primary {
        display: block;
        box-sizing: border-box;
        width: 100%;
        min-height: 56px;
        margin-top: 18px;
        border: 0;
        border-radius: 12px;
        background: #ff2e63;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
    }

    .auth-primary:hover {
        background: #ff4d7d;
    }

    .auth-check {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        color: #dce1eb;
        font-size: 14px;
        line-height: 1.6;
    }

    .auth-check input {
        width: 18px;
        height: 18px;
        margin-top: 2px;
        flex-shrink: 0;
        accent-color: #ff2e63;
    }

    .auth-check a,
    .authbox-new .linkbtn {
        color: #ff4d7d;
        text-decoration: none;
    }

    .auth-check a {
        text-decoration: underline;
        text-underline-offset: 3px;
    }

    .auth-options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 4px;
    }

    .authbox-new .linkbtn {
        padding: 0;
        background: none;
        border: 0;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
    }


.auth-switch {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 16px;
    padding: 16px 12px;
    text-align: center;
    background: #12161e;
    border: 1px solid #303744;
    border-radius: 12px;
}

.auth-switch p {
    margin: 0;
    color: #b6c0d0;
    font-size: 14px;
}

    .auth-back {
        display: block;
        margin: 18px auto 0;
    }

    @media (max-width: 480px) {
        .authbox-new {
            margin: 24px auto;
            padding: 26px 20px;
        }

        .auth-heading h1 {
            font-size: 26px;
        }
    }
</style>

</head>
<body>
    <div id="nav"></div>


<main class="authbox authbox-new">

    <div class="auth-heading">
        <p id="eyebrow" class="auth-eyebrow">
            NEW TO MARU MANHWA?
        </p>

        <h1 id="title">Create an account</h1>

        <p id="subtitle" class="muted">
            Join Maru Manhwa and start reading.
        </p>
    </div>

    <div id="msg" class="notice" style="display:none"></div>

    <div id="usernameBox" style="display:none">
        <input
            id="username"
            class="field"
            type="text"
            placeholder="Username"
            autocomplete="username"
        >
    </div>

    <input
        id="email"
        class="field"
        type="email"
        placeholder="Email address"
        autocomplete="email"
    >

    <input
        id="password"
        class="field"
        type="password"
        placeholder="Password"
        autocomplete="new-password"
    >

    <label id="termsRow" class="auth-check" style="display:none">
        <input id="agreeTerms" type="checkbox">
        <span>
            I agree to the
            <a href="/terms" target="_blank" rel="noopener">
                Terms of Service
            </a>
            and
            <a href="/privacy" target="_blank" rel="noopener">
                Privacy Policy
            </a>.
        </span>
    </label>

    <div id="rememberRow" class="auth-options" style="display:none">
        <label class="auth-check">
            <input id="rememberMe" type="checkbox" checked>
            <span>Remember me</span>
        </label>

        <button id="forgot" class="linkbtn" type="button">
            Forgot password?
        </button>
    </div>

    <button id="login" class="btn auth-primary" type="button">
        Log in
    </button>

    <button id="signup" class="btn auth-primary" type="button">
        Create account
    </button>

    <button id="reset" class="btn auth-primary" type="button"
        style="display:none">
        Send reset email
    </button>

    <button id="backToLogin" class="linkbtn auth-back"
        type="button" style="display:none">
        Back to login
    </button>

    <div id="switchBox" class="auth-switch">
        <p id="switchPrompt">Already have an account?</p>

        <button id="switch" class="linkbtn" type="button">
            Log in
        </button>
    </div>

</main>


<div id="footer"></div>

<script type="module">
    import { footer, nav } from '/js/app.js';

    import {
        auth,
        db,
        FB,
        firebaseReady
    } from '/js/firebase.js';

    nav();

    const title = document.getElementById('title');
    const eyebrow = document.getElementById('eyebrow');
    const termsRow = document.getElementById('termsRow');
    const agreeTerms = document.getElementById('agreeTerms');
    const rememberRow = document.getElementById('rememberRow');
    const switchPrompt = document.getElementById('switchPrompt');
    const subtitle = document.getElementById('subtitle');
    const msg = document.getElementById('msg');

    const usernameBox =
        document.getElementById('usernameBox');

    const username =
        document.getElementById('username');

    const email =
        document.getElementById('email');

    const password =
        document.getElementById('password');

    const login =
        document.getElementById('login');

    const signup =
        document.getElementById('signup');

    const reset =
        document.getElementById('reset');

    const forgot =
        document.getElementById('forgot');

    const backToLogin =
        document.getElementById('backToLogin');

    
    function showMessage(text) {
        msg.style.display = 'block';
        msg.textContent = text;
    }


    function hideMessage() {
        msg.style.display = 'none';
        msg.textContent = '';
    }


    
    function setMode(mode) {
        hideMessage();

        usernameBox.style.display = 'none';
        password.style.display = 'block';

        login.style.display = 'none';
        signup.style.display = 'none';
        reset.style.display = 'none';

        forgot.style.display = 'none';
        backToLogin.style.display = 'none';

        termsRow.style.display = 'none';
        rememberRow.style.display = 'none';

        document.getElementById('switchBox').style.display = 'block';

        if (mode === 'signup') {
            eyebrow.textContent = 'NEW TO MARU MANHWA?';
            title.textContent = 'Create an account';
            subtitle.textContent = 'Join Maru Manhwa and start reading.';

            usernameBox.style.display = 'block';
            password.autocomplete = 'new-password';

            signup.style.display = 'block';
            termsRow.style.display = 'flex';

            switchPrompt.textContent = 'Already have an account?';
            document.getElementById('switch').textContent = 'Log in';
            document.getElementById('switch').onclick =
                () => setMode('login');
        }

        if (mode === 'login') {
            eyebrow.textContent = 'WELCOME BACK';
            title.textContent = 'Welcome back';
            subtitle.textContent = 'Log in to continue your reading journey.';

            password.autocomplete = 'current-password';

            login.style.display = 'block';
rememberRow.style.display = 'flex';
forgot.style.display = 'inline';

            switchPrompt.textContent = "Don't have an account?";
            document.getElementById('switch').textContent = 'Create account';
            document.getElementById('switch').onclick =
                () => setMode('signup');
        }

        if (mode === 'forgot') {
            eyebrow.textContent = 'ACCOUNT RECOVERY';
            title.textContent = 'Reset your password';
            subtitle.textContent = 'Enter your email to receive a password reset link.';

            usernameBox.style.display = 'none';
            password.style.display = 'none';

            reset.style.display = 'block';
            backToLogin.style.display = 'block';

            document.getElementById('switchBox').style.display = 'none';
        }
    }



    login.onclick = async () => {

        if (!firebaseReady) {
            showMessage(
                'Firebase is not configured yet.'
            );
            return;
        }

        const mail =
            email.value.trim();

        const pass =
            password.value;


        if (!mail || !pass) {
            showMessage(
                'Please enter your email and password.'
            );
            return;
        }


        try {

        
await FB.signInWithEmailAndPassword(auth, mail, pass);
location.href = '/profile';



        } catch (e) {

            showMessage(
                e.message
            );

        }

    };


    signup.onclick = async () => {

        if (!firebaseReady) {
            showMessage(
                'Firebase is not configured yet.'
            );
            return;
        }


        const name =
            username.value.trim();

        const mail =
            email.value.trim();

        const pass =
            password.value;


        if (!name) {
            showMessage(
                'Please enter a username.'
            );
            return;
        }

        if (!agreeTerms.checked) {
            showMessage(
                'Please agree to the Terms of Service and Privacy Policy to create an account.'
            );
            return;
        }

        if (name.length < 3 || name.length > 20) {

            showMessage(
                'Username must be 3–20 characters.'
            );

            return;
        }


        if (!/^[a-zA-Z0-9_]+$/.test(name)) {

            showMessage(
                'Username can only contain letters, numbers and _.'
            );

            return;
        }


        if (!mail) {

            showMessage(
                'Please enter your email.'
            );

            return;
        }


        if (pass.length < 6) {

            showMessage(
                'Password must be at least 6 characters.'
            );

            return;
        }


        try {

            const usernameQuery =
                FB.query(
                    FB.collection(db, 'users'),
                    FB.where(
                        'usernameLower',
                        '==',
                        name.toLowerCase()
                    ),
                    FB.limit(1)
                );


            const usernameResults =
                await FB.getDocs(
                    usernameQuery
                );


            if (!usernameResults.empty) {

                showMessage(
                    'That username is already taken.'
                );

                return;
            }


            const result =
                await FB.createUserWithEmailAndPassword(
                    auth,
                    mail,
                    pass
                );


            await FB.updateProfile(
                result.user,
                {
                    displayName: name
                }
            );


            await FB.setDoc(
                FB.doc(
                    db,
                    'users',
                    result.user.uid
                ),
                {
                    username: name,
                    usernameLower:
                        name.toLowerCase(),
                    email: mail,
                    profilePic:
                        '/assets/profile.png',
                    role: 'user',
                    createdAt:
                        FB.serverTimestamp()
                }
            );


        
showMessage(
    'Account created! You can read manhwa now. Verify your email on your profile to rate and comment.'
);

location.href = '/profile';



        } catch (e) {

            showMessage(
                e.message
            );

        }

    };


    forgot.onclick = () => {

        setMode('forgot');

        email.focus();

    };


    reset.onclick = async () => {

        if (!firebaseReady) {

            showMessage(
                'Firebase is not configured yet.'
            );

            return;
        }


        const mail =
            email.value.trim();


        if (!mail) {

            showMessage(
                'Enter your email first.'
            );

            email.focus();

            return;
        }


        try {

            await FB.sendPasswordResetEmail(
                auth,
                mail
            );


            showMessage(
                'Password reset email sent. Check your inbox.'
            );


        } catch (e) {

            showMessage(
                e.message
            );

        }

    };


    backToLogin.onclick = () => {

        setMode('login');

        email.focus();

    };


    setMode('signup');


    document
        .getElementById('footer')
        .innerHTML = footer();

</script>

</body>
</html>
