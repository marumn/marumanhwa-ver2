<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Maru Manhwa</title><link rel="stylesheet" href="../css/style.css"></head><body><div id="nav"></div><main class="authbox"><h1>Welcome back</h1><p class="muted">Sign in to sync bookmarks and reading history.</p><div id="msg" class="notice" style="display:none"></div><input id="email" class="field" type="email" placeholder="Email"><input id="password" class="field" type="password" placeholder="Password"><button id="login" class="btn" style="width:100%;margin-top:8px">Log in</button><button id="signup" class="btn secondary" style="width:100%;margin-top:8px">Create account</button></main><div id="footer"></div><script type="module">import {footer,nav} from '../js/app.js';import {auth,FB,firebaseReady} from '../js/firebase.js';nav();let msg=x=>{document.querySelector('#msg').style.display='block';document.querySelector('#msg').textContent=x};login.onclick=async()=>{if(!firebaseReady)return msg('Firebase is not configured yet. Add js/firebase-config.js first.');try{await FB.signInWithEmailAndPassword(auth,email.value,password.value);location.href='../index.html'}catch(e){msg(e.message)}};signup.onclick=async()=>{if(!firebaseReady)return msg('Firebase is not configured yet.');try{let c=await FB.createUserWithEmailAndPassword(auth,email.value,password.value);await FB.setDoc(FB.doc((await import('../js/firebase.js')).db,'users',c.user.uid),{username:email.value.split('@')[0],profilePic:'/assets/profile.png',createdAt:FB.serverTimestamp()});location.href='../index.html'}catch(e){msg(e.message)}};footerEl.innerHTML=footer();</script></body></html>
