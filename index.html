<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Maru Manhwa</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

   
    <div id="nav"></div>


    <main>

       
        <section class="hero">
            <div class="container">

                <div class="badge">
                    YOUR MOOD. YOUR MANHWA.
                </div>

                <h1>
                    Read your next obsession.
                </h1>

                <p>
                    Discover action, fantasy, romance and more in a fast,
                    clean reader built for mobile and desktop.
                </p>

                <a class="btn" href="browse.html">
                    Explore Library
                </a>

            </div>
        </section>


        
        <section class="section" id="latest">
            <div class="container">

                <div class="sectionhead">
                    <h2>Latest Updates</h2>

                    <a class="muted" href="browse.html">
                        View all →
                    </a>
                </div>

                <div id="latestGrid" class="grid"></div>

            </div>
        </section>


        <!-- Popular -->
        <section class="section" id="popular">
            <div class="container">

                <div class="sectionhead">
                    <h2>Popular</h2>
                </div>

                <div id="popularGrid" class="grid"></div>

            </div>
        </section>

    </main>



    <div id="footer"></div>


  
    <script type="module">

        import {
            footer,
            nav,
            listSeries,
            card
        } from './js/app.js';


        
        nav();


       
        const latestGrid = document.getElementById('latestGrid');
        const popularGrid = document.getElementById('popularGrid');
        const footerEl = document.getElementById('footer');


     
        const series = await listSeries();


        latestGrid.innerHTML = series
            .map(card)
            .join('');


    
        const popular = [...series]
            .sort((a, b) => (b.rating || 0) - (a.rating || 0));


        popularGrid.innerHTML = popular
            .map(card)
            .join('');


       
        footerEl.innerHTML = footer();

    </script>

</body>

</html>
